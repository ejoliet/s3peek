name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # macOS: test-only, 3.12 only — pyperclip pbcopy/xclip divergence matters for core users
          - os: macos-latest
            python-version: "3.12"
            skip_lint: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        if: matrix.skip_lint != true
        run: make lint
      - name: Test
        run: make test
